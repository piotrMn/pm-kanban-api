openapi: 3.0.0
info:
  title: Kanban Tool API
  version: 1.0.0

paths:

  /auth/register:
    post:
      summary: Register user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created

  /auth/login:
    post:
      summary: Login user
      responses:
        '200':
          description: Auth token returned

  /teams:
    get:
      summary: Get user teams
      responses:
        '200':
          description: List of teams
    post:
      summary: Create team

  /teams/{teamId}/members:
    post:
      summary: Add user to team
    delete:
      summary: Remove user from team

  /boards/{teamId}:
    get:
      summary: Get board for team

  /items:
    get:
      summary: Get items (filter by teamId, state)
    post:
      summary: Create item

  /items/{id}:
    get:
      summary: Get item details
    put:
      summary: Update item
    delete:
      summary: Delete item

  /items/{id}/assign:
    post:
      summary: Assign user to item

  /items/{id}/state:
    post:
      summary: Change item state

  /items/{id}/estimate:
    post:
      summary: Set estimation

  /wip-limits:
    get:
      summary: Get WIP limits
    post:
      summary: Set WIP limit

components:

  schemas:

    RegisterRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
        name:
          type: string

    Team:
      type: object
      properties:
        id:
          type: string
        name:
          type: string

    Item:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        type:
          type: string
        state:
          type: string
        estimation:
          type: integer