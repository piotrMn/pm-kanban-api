spring:
  h2:
    console:
      enabled: true
  application:
    name: KanbanApi
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        format_sql: true
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver
    initialization-mode: always
  #  url: jdbc:postgresql://localhost:5432/postgres
  #  username: postgres
  #  password: aurora123
server:
  servlet:
    context-path: /kanban-api
logging:
  level:
    org:
      hibernate:
        SQL: INFO
